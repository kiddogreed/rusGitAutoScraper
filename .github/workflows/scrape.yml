name: Scrape

on:
  # Manual trigger only (per project config). A `schedule:` cron trigger can
  # be added back here later if automatic runs are wanted.
  workflow_dispatch:
    inputs:
      language:
        description: "Filter trending repos by language (e.g. python). Leave empty for all languages."
        required: false
        default: ""
      since:
        description: "Trending period"
        required: false
        type: choice
        default: daily
        options:
          - daily
          - weekly
          - monthly

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TRENDING_LANGUAGE: ${{ github.event.inputs.language }}
      TRENDING_SINCE: ${{ github.event.inputs.since }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update scraped data [skip ci]"
          git push
